<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>麻辣湯屋さん - Malatang Walker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Kosugi Maru", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(#2b1b12, #1a1008);
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
    padding: 16px;
  }

  h1 {
    margin: 6px 0;
    font-size: 22px;
    letter-spacing: 2px;
    color: #ffcf66;
    text-shadow: 0 2px 4px #000;
  }

  #gameWrap {
    position: relative;
    width: 820px;
    max-width: 96vw;
  }

  #gameCanvas {
    display: block;
    width: 100%;
    background: #87ceeb;
    border: 6px solid #7a3b1e;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    image-rendering: pixelated;
  }

  #hud {
    position: absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-size: 14px;
  }

  .hudBox {
    background: rgba(0,0,0,.55);
    border-radius: 10px;
    padding: 8px 12px;
    line-height: 1.5;
    backdrop-filter: blur(2px);
  }

  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,5,2,.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-radius: 6px;
    padding: 20px;
  }

  #overlay.hidden {
    display: none;
  }

  #overlay h2 {
    color: #ffcf66;
    font-size: 26px;
    margin-bottom: 6px;
  }

  #overlay p {
    margin: 4px 0;
    font-size: 15px;
    max-width: 500px;
    line-height: 1.7;
  }

  .stars {
    font-size: 40px;
    margin: 12px 0;
    letter-spacing: 8px;
  }

  button.gameBtn {
    margin-top: 14px;
    padding: 10px 28px;
    font-size: 16px;
    border: none;
    border-radius: 24px;
    background: linear-gradient(#ffd27a, #ff9a3c);
    color: #4a2000;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #a35a00;
  }

  button.gameBtn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #a35a00;
  }

  #controls {
    margin-top: 10px;
    font-size: 13px;
    color: #d8c3a5;
    text-align: center;
  }

  .basketRow {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    max-width: 220px;
    margin-top: 4px;
  }

  .basketRow span {
    font-size: 18px;
  }
</style>
</head>

<body>

<h1>麻辣湯屋さん</h1>

<div id="gameWrap">

  <canvas id="gameCanvas" width="820" height="420"></canvas>

  <div id="hud">

    <div class="hudBox" id="requestBox"></div>

    <div class="hudBox" id="basketBox">
      作った麻辣湯<br>
      辛さ:
      <span id="curSpice">0</span>
      /
      予算:
      ¥<span id="curPrice">0</span>

      <div class="basketRow" id="basketIcons"></div>
    </div>

  </div>

  <div id="overlay" class="hidden">

    <h2 id="ovTitle"></h2>

    <div class="stars" id="ovStars"></div>

    <p id="ovMsg"></p>

    <button class="gameBtn" id="ovBtn">
      はじめる
    </button>

  </div>

</div>

<div id="controls">
  ← → ↑ ↓ で移動 /
  具材に触れると自動で拾います /
  お客さんに近づいて渡します
</div>


<script>

(() => {

  /* =========================
     Canvas
  ========================= */

  const canvas = document.getElementById('gameCanvas');

  const ctx = canvas.getContext('2d');

  const W = canvas.width;

  const H = canvas.height;

  const GROUND_Y = H - 70;

  const CEIL_Y = 90;


  /* =========================
     具材
  ========================= */

  const ingredientPool = [

    {
      name:'もやし',
      emoji:'🥬',
      spice:0,
      price:50
    },

    {
      name:'青菜',
      emoji:'🥦',
      spice:0,
      price:60
    },

    {
      name:'豆腐',
      emoji:'🧊',
      spice:0,
      price:80
    },

    {
      name:'卵',
      emoji:'🥚',
      spice:0,
      price:70
    },

    {
      name:'肉団子',
      emoji:'🍡',
      spice:1,
      price:150
    },

    {
      name:'えのき',
      emoji:'🍄',
      spice:0,
      price:60
    },

    {
      name:'春雨',
      emoji:'🍜',
      spice:0,
      price:90
    },

    {
      name:'油揚げ',
      emoji:'🟫',
      spice:0,
      price:70
    },

    {
      name:'ラー油',
      emoji:'🌶️',
      spice:3,
      price:100
    },

    {
      name:'花椒',
      emoji:'🫘',
      spice:2,
      price:90
    },

    {
      name:'唐辛子',
      emoji:'🔴',
      spice:2,
      price:80
    },

    {
      name:'にんにく',
      emoji:'🧄',
      spice:1,
      price:50
    },

    {
      name:'牛肉',
      emoji:'🥩',
      spice:0,
      price:200
    },

    {
      name:'エビ',
      emoji:'🍤',
      spice:0,
      price:180
    },

    {
      name:'きくらげ',
      emoji:'🍂',
      spice:0,
      price:70
    },

    {
      name:'ラー油増し',
      emoji:'🔥',
      spice:4,
      price:120
    }

  ];


  /* =========================
     キャラクター画像
  ========================= */

  const CHAR_SVG = {

    child: './child.svg',

    gakusei: './gakusei.svg',

    murabito: './murabito.svg',

    shakaijin: './shakaijin.svg',

    majo: './majo.svg'

  };


  const CHAR_IMG = {};


  Object.keys(CHAR_SVG).forEach(key => {

    const img = new Image();

    img.src = CHAR_SVG[key];

    CHAR_IMG[key] = img;

  });


  /* =========================
     ステージ
  ========================= */

  const stages = [

    {
      key:'child',
      name:'男の子',
      spice:1,
      budget:400,
      tol:'辛いのはちょっと苦手…安くしてね',
      len:1600,
      imgW:330,
      imgH:450
    },

    {
      key:'gakusei',
      name:'女子高生',
      spice:4,
      budget:500,
      tol:'ちょっぴり辛いのが好き！でも節約中なの',
      len:2000,
      imgW:390,
      imgH:480
    },

    {
      key:'murabito',
      name:'おじいさん',
      spice:0,
      budget:600,
      tol:'胃にやさしい、昔ながらの薄味が一番じゃよ',
      len:1800,
      imgW:390,
      imgH:480
    },

    {
      key:'shakaijin',
      name:'サラリーマン',
      spice:7,
      budget:900,
      tol:'ストレス発散にガツンと辛いやつを頼むよ',
      len:2200,
      imgW:390,
      imgH:480
    },

    {
      key:'majo',
      name:'モンスター魔女',
      spice:11,
      budget:1100,
      tol:'辛ければ辛いほどいいわよ！ケチらないでね',
      len:2400,
      imgW:450,
      imgH:540
    }

  ];


  /* =========================
     ゲーム状態
  ========================= */

  let state = {

    stageIndex:0,

    fieldLen:0,

    camX:0,

    player:{
      x:60,
      y:GROUND_Y,
      w:34,
      h:34,
      dir:1,
      walkT:0
    },

    keys:{},

    items:[],

    basket:[],

    customer:null,

    served:false,

    running:false,

    totalStars:0

  };


  /* =========================
     Utility
  ========================= */

  function rand(a,b){

    return a + Math.random() * (b-a);

  }


  /* =========================
     ステージ生成
  ========================= */

  function spawnStage(i){

    const st = stages[i];

    state.fieldLen = st.len;

    state.player.x = W / 2;

    state.player.y = GROUND_Y;

    state.player.walkT = 0;

    state.camX = Math.max(
      0,
      Math.min(
        state.fieldLen - W,
        state.player.x - W / 2
      )
    );

    state.basket = [];

    state.served = false;


    const count = 16 + i * 2;

    const items = [];


    for(let k=0; k<count; k++){

      const ing =
        ingredientPool[
          Math.floor(
            Math.random() * ingredientPool.length
          )
        ];


      items.push({

        ...ing,

        x:rand(
          220,
          st.len - 260
        ),

        y:rand(
          CEIL_Y + 10,
          GROUND_Y - 10
        ),

        taken:false,

        bob:
          Math.random() *
          Math.PI *
          2

      });

    }


    state.items = items;


    state.customer = {

      x:st.len - 140,

      y:GROUND_Y,

      ...st

    };


    updateHUD();

  }


  /* =========================
     HUD
  ========================= */

  function updateHUD(){

    const st =
      stages[state.stageIndex];


    document.getElementById(
      'requestBox'
    ).innerHTML =

      `<img
        src="${CHAR_SVG[st.key]}"
        style="
          height:34px;
          vertical-align:middle;
          margin-right:6px;
        "
      >

      <b>${st.name}</b>

      （ステージ
      ${state.stageIndex + 1}
      /
      ${stages.length}）

      <br>

      希望の辛さ:

      ${
        '🌶️'.repeat(
          Math.min(
            st.spice,
            10
          )
        ) || 'なし'
      }

      (${st.spice})

      <br>

      予算:
      ¥${st.budget}

      <br>

      <i>
        ${st.tol}
      </i>`;


    const spice =
      state.basket.reduce(
        (a,b) => a + b.spice,
        0
      );


    const price =
      state.basket.reduce(
        (a,b) => a + b.price,
        0
      );


    document.getElementById(
      'curSpice'
    ).textContent =
      spice;


    document.getElementById(
      'curPrice'
    ).textContent =
      price;


    document.getElementById(
      'basketIcons'
    ).innerHTML =

      state.basket.length

      ?

      state.basket
        .map(
          b =>
          `<span title="${b.name}">
            ${b.emoji}
          </span>`
        )
        .join('')

      :

      `<span
        style="
          font-size:13px;
          color:#ccc;
        "
      >
        まだ何もない
      </span>`;

  }


  /* =========================
     キー入力
  ========================= */

  window.addEventListener(
    'keydown',
    e => {

      if(
        [
          'ArrowLeft',
          'ArrowRight',
          'ArrowUp',
          'ArrowDown'
        ].includes(e.key)
      ){

        e.preventDefault();

      }


      state.keys[e.key] = true;

    }
  );


  window.addEventListener(
    'keyup',
    e => {

      state.keys[e.key] = false;

    }
  );


  /* =========================
     更新処理
  ========================= */

  function update(){

    if(!state.running){

      return;

    }


    const p =
      state.player;


    const speed =
      3.4;


    let mx = 0;

    let my = 0;


    if(state.keys['ArrowLeft']){

      mx -= speed;

      p.dir = -1;

    }


    if(state.keys['ArrowRight']){

      mx += speed;

      p.dir = 1;

    }


    if(state.keys['ArrowUp']){

      my -= speed;

    }


    if(state.keys['ArrowDown']){

      my += speed;

    }


    if(mx || my){

      p.walkT += 0.25;

    }else{

      p.walkT = 0;

    }


    p.x =
      Math.max(
        20,
        Math.min(
          state.fieldLen - 20,
          p.x + mx
        )
      );


    p.y =
      Math.max(
        CEIL_Y,
        Math.min(
          GROUND_Y,
          p.y + my
        )
      );


    state.camX =
      Math.max(
        0,
        Math.min(
          state.fieldLen - W,
          p.x - W / 2
        )
      );


    /* -------------------------
       具材を拾う
    ------------------------- */

    for(const it of state.items){

      if(it.taken){

        continue;

      }


      const dx =
        it.x - p.x;


      const dy =
        it.y - p.y;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      if(distance < 30){

        it.taken = true;

        state.basket.push(it);

        updateHUD();

      }

    }


    /* -------------------------
       お客さんに渡す
    ------------------------- */

    if(
      !state.served &&
      state.customer
    ){

      const c =
        state.customer;


      const dx =
        c.x - p.x;


      const dy =
        c.y - p.y;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      if(distance < 46){

        serve();

      }

    }

  }


  /* =========================
     判定
  ========================= */

  function serve(){

    state.served = true;

    state.running = false;


    const st =
      stages[state.stageIndex];


    const spice =
      state.basket.reduce(
        (a,b) => a + b.spice,
        0
      );


    const price =
      state.basket.reduce(
        (a,b) => a + b.price,
        0
      );


    const spiceDiff =
      Math.abs(
        spice - st.spice
      );


    const priceDiff =
      price - st.budget;


    let score =
      100
      -
      spiceDiff * 9
      -
      (
        priceDiff > 0

        ?

        priceDiff * 0.4

        :

        Math.abs(priceDiff) * 0.15
      );


    score =
      Math.max(
        0,
        Math.min(
          100,
          score
        )
      );


    let stars = 0;


    if(score >= 85){

      stars = 3;

    }

    else if(score >= 60){

      stars = 2;

    }

    else if(score >= 30){

      stars = 1;

    }


    state.totalStars += stars;


    let msg = '';


    if(spiceDiff <= 1){

      msg +=
        '辛さはドンピシャ！ ';

    }

    else if(spice > st.spice){

      msg +=
        '辛くしすぎちゃったかな… ';

    }

    else{

      msg +=
        'もうちょっと辛くてもよかったかも… ';

    }


    if(priceDiff > 0){

      msg +=
        `予算オーバー ¥${priceDiff}。`;

    }

    else if(priceDiff < -150){

      msg +=
        'ちょっと寂しい内容かも。';

    }

    else{

      msg +=
        '予算もぴったり！';

    }


    showOverlay(

      `<img
        src="${CHAR_SVG[st.key]}"
        style="
          height:44px;
          vertical-align:middle;
          margin-right:8px;
        "
      >
      ${st.name} の判定`,

      '★'.repeat(stars)
      +
      '☆'.repeat(3-stars),

      `辛さ ${spice}
      （希望 ${st.spice}）

      お会計 ¥${price}
      （予算 ¥${st.budget}）

      ${msg}`,

      state.stageIndex
      <
      stages.length - 1

      ?

      '次のお客さんへ'

      :

      '結果を見る',

      () => {

        if(
          state.stageIndex
          <
          stages.length - 1
        ){

          state.stageIndex++;

          spawnStage(
            state.stageIndex
          );

          hideOverlay();

          state.running = true;

        }

        else{

          finalResult();

        }

      }

    );

  }


  /* =========================
     最終結果
  ========================= */

  function finalResult(){

    const max =
      stages.length * 3;


    showOverlay(

      '🎉 営業終了！',

      '',

      `総合成績:
      ${state.totalStars}
      /
      ${max} 星

      おつかれさまでした！`,

      'もう一度最初から',

      () => {

        state.stageIndex = 0;

        state.totalStars = 0;

        spawnStage(0);

        hideOverlay();

        state.running = true;

      }

    );

  }


  /* =========================
     オーバーレイ
  ========================= */

  function showOverlay(
    title,
    stars,
    msg,
    btnLabel,
    onClick
  ){

    document.getElementById(
      'ovTitle'
    ).innerHTML =
      title;


    document.getElementById(
      'ovStars'
    ).textContent =
      stars;


    document.getElementById(
      'ovMsg'
    ).innerHTML =
      msg.replace(
        /\n/g,
        '<br>'
      );


    const oldBtn =
      document.getElementById(
        'ovBtn'
      );


    const newBtn =
      oldBtn.cloneNode(true);


    newBtn.textContent =
      btnLabel;


    newBtn.addEventListener(
      'click',
      onClick
    );


    oldBtn.parentNode.replaceChild(
      newBtn,
      oldBtn
    );


    document.getElementById(
      'overlay'
    ).classList.remove(
      'hidden'
    );

  }


  function hideOverlay(){

    document.getElementById(
      'overlay'
    ).classList.add(
      'hidden'
    );

  }


  /* =========================
     背景
  ========================= */

  function drawBackground(){

    ctx.fillStyle =
      '#8fd0f2';


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    /* 遠景 */

    ctx.fillStyle =
      '#c96b3c';


    for(let i=0; i<6; i++){

      const bx =
        (
          i * 260
          -
          state.camX * 0.3
        )
        %
        (W + 300)
        -
        150;


      ctx.beginPath();


      ctx.ellipse(
        bx,
        GROUND_Y - 10,
        140,
        60,
        0,
        0,
        Math.PI * 2
      );


      ctx.fill();

    }


    /* 地面 */

    ctx.fillStyle =
      '#7a4a25';


    ctx.fillRect(
      0,
      GROUND_Y + 18,
      W,
      H - GROUND_Y - 18
    );


    ctx.fillStyle =
      '#96632f';


    for(
      let x =
        -(state.camX % 40);

      x < W;

      x += 40
    ){

      ctx.fillRect(
        x,
        GROUND_Y + 18,
        20,
        H - GROUND_Y - 18
      );

    }


    /* 上側の屋台っぽい色 */

    ctx.fillStyle =
      'rgba(255,180,90,0.15)';


    ctx.fillRect(
      0,
      0,
      W,
      CEIL_Y
    );

  }


  /* =========================
     提灯
  ========================= */

  function drawLanterns(){

    ctx.font =
      '30px sans-serif';


    for(
      let wx = 100;

      wx < state.fieldLen;

      wx += 220
    ){

      const sx =
        wx - state.camX;


      if(
        sx < -40 ||
        sx > W + 40
      ){

        continue;

      }


      ctx.fillText(
        '🏮',
        sx,
        CEIL_Y - 10
      );

    }

  }


  /* =========================
     具材
  ========================= */

  function drawItems(){

    if(!state.items){
      return;
    }

    for(const it of state.items){

      if(it.taken){
        continue;
      }

      const sx = it.x - state.camX;

      if(
        sx < -50 ||
        sx > W + 50
      ){
        continue;
      }

      it.bob += 0.06;

      const bobY = Math.sin(it.bob) * 4;
      const drawY = it.y + bobY;

      // 食材の絵文字
      ctx.font = '30px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(
        it.emoji,
        sx,
        drawY
      );

      // 食材名の背景
      ctx.font = '12px "Kosugi Maru", sans-serif';
      const nameWidth =
        ctx.measureText(it.name).width + 12;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(
        sx - nameWidth / 2,
        drawY + 7,
        nameWidth,
        19
      );

      // 食材名
      ctx.fillStyle = '#ffffff';
      ctx.fillText(
        it.name,
        sx,
        drawY + 21
      );

      // 辛い食材だけ辛さを表示
      if(it.spice > 0){

        const spiceText =
          `🌶 辛さ +${it.spice}`;

        ctx.font =
          '11px "Kosugi Maru", sans-serif';

        const spiceWidth =
          ctx.measureText(spiceText).width + 12;

        ctx.fillStyle =
          'rgba(160,20,10,0.85)';

        ctx.fillRect(
          sx - spiceWidth / 2,
          drawY + 29,
          spiceWidth,
          18
        );

        ctx.fillStyle =
          '#fff3d5';

        ctx.fillText(
          spiceText,
          sx,
          drawY + 42
        );

      }

    }

    ctx.textAlign = 'left';

  }


  /* =========================
     お客さん
  ========================= */

  function drawCustomer(){

    const c =
      state.customer;


    /* ここが重要。
       ゲーム開始前は customer が null */
    if(!c){

      return;

    }


    const sx =
      c.x - state.camX;


    if(
      sx < -100 ||
      sx > W + 100
    ){

      return;

    }


    const img =
      CHAR_IMG[c.key];


    const dh =
      140;


    const dw =
      dh
      *
      (
        c.imgW /
        c.imgH
      );


    const bottomY =
      c.y + 20;


    if(
      img &&
      img.complete &&
      img.naturalWidth
    ){

      ctx.drawImage(
        img,
        sx - dw / 2,
        bottomY - dh,
        dw,
        dh
      );

    }

    else{

      ctx.fillStyle =
        'rgba(255,255,255,.25)';


      ctx.fillRect(
        sx - dw / 2,
        bottomY - dh,
        dw,
        dh
      );

    }


    ctx.font =
      '13px sans-serif';


    ctx.fillStyle =
      '#fff';


    ctx.textAlign =
      'center';


    ctx.fillText(
      c.name,
      sx,
      bottomY + 16
    );


    ctx.textAlign =
      'left';

  }


  /* =========================
     プレイヤー
  ========================= */

  function drawPlayer(){

    const p =
      state.player;


    const sx =
      p.x - state.camX;


    const bob =
      Math.sin(
        p.walkT
      ) * 4;


    ctx.save();


    ctx.translate(
      sx,
      p.y + bob
    );


    ctx.scale(
      p.dir,
      1
    );


    ctx.font =
      '40px sans-serif';


    ctx.textAlign =
      'center';


    ctx.fillText(
      '🧑‍🍳',
      0,
      14
    );


    ctx.restore();


    ctx.textAlign =
      'left';

  }


  /* =========================
     鍋
  ========================= */

  function drawPot(){

    ctx.font =
      '30px sans-serif';


    ctx.fillText(
      '🍲',
      14,
      H - 14
    );

  }


  /* =========================
     ゲームループ
  ========================= */

  function loop(){

    update();

    drawBackground();

    drawLanterns();

    drawItems();


    /* 開始前は描画しない */

    if(state.customer){

      drawCustomer();

    }


    drawPlayer();

    drawPot();


    requestAnimationFrame(
      loop
    );

  }


  /* =========================
     ゲーム開始
  ========================= */

  function startGame(){

    spawnStage(0);

    hideOverlay();

    state.running = true;

  }


  /* =========================
     タイトル画面
  ========================= */

  showOverlay(

    '麻辣湯屋さん',

    '',

    `ステージごとに違うお客さんが来店！

  矢印キーで動いて具材を拾い、
  お客さんの希望する「辛さ」と「予算」に
  近い麻辣湯を作ろう！

  🌶 辛い食材には「辛さ +○」と表示されます。

  近ければ近いほど高得点（★3つ）！`,

    'はじめる',

    startGame

  );


  /* =========================
     描画開始
  ========================= */

  requestAnimationFrame(
    loop
  );

})();

</script>

</body>
</html>
